name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "Run gofmt -w ." && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check OpenSpec config parses
        working-directory: .
        # OpenSpec silently ignores a config.yaml it can't parse, dropping all
        # project context and rules, and `openspec validate` doesn't catch it.
        run: npx --yes yaml@2.9.1 valid < openspec/config.yaml
      - name: Validate OpenSpec specs and changes
        working-directory: .
        # Pinned to match local development; upgrade deliberately with `openspec update`.
        run: npx --yes @fission-ai/openspec@1.14.1 validate --all --strict --no-interactive
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t chainguard-mcp .
      - name: Smoke test
        run: |
          test "$(docker run --rm chainguard-mcp -version)" = "dev"
          docker run -d --name app -p 127.0.0.1:8080:8080 chainguard-mcp
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q "<title>Chainguard Image Explorer</title>"
          curl -fs http://127.0.0.1:8080/api/history | grep -q '"last_snapshot"'
          docker rm -f app
      - name: Third-party notices
        run: |
          docker run --rm chainguard-mcp -licenses > notices.txt
          grep -q "golang.org/x/sync" notices.txt
          grep -q "react-router" notices.txt
          grep -q "dfc" notices.txt
          docker create --name nt chainguard-mcp
          docker cp nt:/THIRD_PARTY_NOTICES image-notices.txt
          docker rm nt
          cmp notices.txt image-notices.txt

  goreleaser:
    name: Release config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Check the archive's third-party notices
        run: |
          archive=$(ls dist/chainguard-mcp_*_linux_amd64.tar.gz)
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          test -s unpacked/THIRD_PARTY_NOTICES
          unpacked/chainguard-mcp -licenses | cmp - unpacked/THIRD_PARTY_NOTICES
          echo "THIRD_PARTY_NOTICES in $archive matches the binary's -licenses output"
