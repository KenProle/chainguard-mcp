name: History

# Takes a daily snapshot of Chainguard's image catalog and appends it to
# catalog-history.jsonl on the `data` branch. `main` is protected and can't be
# pushed to by a workflow, and daily commits there would run the code's CI.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Nothing by default; the job asks for only what it needs.
permissions: {}

concurrency:
  group: catalog-history
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    permissions:
      # Only to push the new line to the data branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o chainguard-mcp .
      - name: Check out the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: history
          # Kept out of .git/config so the build and the snapshot, which read
          # from outside services, never have the write token. Only the push
          # step below gets it.
          persist-credentials: false
      - name: Take the snapshot
        # A refused snapshot exits 1 and fails the job before anything is committed.
        run: ./chainguard-mcp -record-history history/catalog-history.jsonl
      - name: Commit and push
        working-directory: history
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- catalog-history.jsonl; then
            echo "No new line to publish."
            exit 0
          fi
          message=$(tail -n 1 catalog-history.jsonl | jq -r '"snapshot \(.date): \(.total) images (+\(.added | length) −\(.removed | length)), \(.free) free"')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-history.jsonl
          git commit -m "$message"
          # The token goes in a header for this one command, the way
          # actions/checkout would set it, so it is never written to
          # .git/config or put in the remote URL. Actions masks its value in logs.
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:data
