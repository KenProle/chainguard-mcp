name: History

# Takes a daily snapshot of Chainguard's image catalog and appends it to
# catalog-history.jsonl on the `data` branch. `main` is protected and can't be
# pushed to by a workflow, and daily commits there would run the code's CI.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-history
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o chainguard-mcp .
      - name: Check out the data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: history
      - name: Take the snapshot
        # A refused snapshot exits 1 and fails the job before anything is committed.
        run: ./chainguard-mcp -record-history history/catalog-history.jsonl
      - name: Commit and push
        working-directory: history
        run: |
          if git diff --quiet -- catalog-history.jsonl; then
            echo "No new line to publish."
            exit 0
          fi
          message=$(tail -n 1 catalog-history.jsonl | jq -r '"snapshot \(.date): \(.total) images (+\(.added | length) −\(.removed | length)), \(.free) free"')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-history.jsonl
          git commit -m "$message"
          git push origin HEAD:data
