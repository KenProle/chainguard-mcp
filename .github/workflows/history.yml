name: History

# Takes a daily snapshot of Chainguard's image catalog and appends it to
# catalog-history.jsonl on the `data` branch. `main` is protected and can't be
# pushed to by a workflow, and daily commits there would run the code's CI.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: catalog-history
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    # Builds the project and reads from outside services, so it gets no write
    # token. It hands the updated file to the publish job as an artifact.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o chainguard-mcp .
      - name: Check out the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: history
          persist-credentials: false
      - name: Take the snapshot
        # A refused snapshot exits 1 and fails the job before anything is published.
        run: ./chainguard-mcp -record-history history/catalog-history.jsonl
      - name: Check for a new line
        id: check
        working-directory: history
        run: |
          if git diff --quiet -- catalog-history.jsonl; then
            echo "No new line to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand the file to the publish job
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-history
          path: history/catalog-history.jsonl
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Runs no project code: only checkout, the artifact download, jq and git.
    permissions:
      contents: write
    steps:
      - name: Check out the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
      - name: Take the updated file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-history
          # Outside the checkout, so nothing in the artifact can land in .git
          # (a hook there would run with the write token).
          path: ${{ runner.temp }}/incoming
      - name: Check and copy the file
        env:
          INCOMING: ${{ runner.temp }}/incoming
        run: |
          # Exactly one regular file, catalog-history.jsonl, and every line JSON.
          found=$(find "$INCOMING" -mindepth 1 -printf '%y %P\n')
          if [ "$found" != "f catalog-history.jsonl" ]; then
            echo "::error title=History::Unexpected artifact contents:"
            printf '%s\n' "$found"
            exit 1
          fi
          jq -e . "$INCOMING/catalog-history.jsonl" > /dev/null
          cp "$INCOMING/catalog-history.jsonl" catalog-history.jsonl
      - name: Commit and push
        run: |
          message=$(tail -n 1 catalog-history.jsonl | jq -r '"snapshot \(.date): \(.total) images (+\(.added | length) −\(.removed | length)), \(.free) free"')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-history.jsonl
          git commit -m "$message"
          git push origin HEAD:data
